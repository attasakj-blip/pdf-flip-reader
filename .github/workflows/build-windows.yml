name: Build Windows app
on:
  push:
    branches: [main, claude/project-thread-jtdkdb, claude/project-thread-m1z0kk, claude/microsoft-store-msix, claude/windows-gold]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - run: flutter pub get
      # Quick checks before the long build: the code compiles cleanly and the
      # purchase rules (free tries, Gold, the gift for early Windows users) hold.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/purchases_test.dart
      - run: flutter build windows --release --build-number ${{ github.run_number }}
      # Text from scanned pages (OCR) runs the Tesseract program, which the
      # app looks for in a "tesseract" folder next to Pagelume.exe. Language
      # data is downloaded by the app when first needed, as on Android.
      - name: Add Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = 'C:\Program Files\Tesseract-OCR'
          if (-not (Test-Path "$src\tesseract.exe")) { throw 'Tesseract was not installed' }
          $dest = 'build\windows\x64\runner\Release\tesseract'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Get-ChildItem $src -File | Where-Object { $_.Extension -in '.exe', '.dll' -and $_.Name -notlike 'unins*' -and $_.Name -notlike '*training*' } |
            Copy-Item -Destination $dest
          # Only tesseract.exe is used; the rest are tools for training it.
          Get-ChildItem $dest -Filter *.exe | Where-Object Name -ne 'tesseract.exe' | Remove-Item
          Copy-Item "$src\doc\LICENSE" "$dest\LICENSE.txt" -ErrorAction SilentlyContinue
          & "$dest\tesseract.exe" --version
      # Windows 11 PCs usually have the Visual C++ runtime, but a fresh one
      # may not: put the three DLLs Flutter needs next to the app.
      - name: Add the Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "C:\Windows\System32\$dll" 'build\windows\x64\runner\Release\'
          }
      - name: Make the zip
        shell: pwsh
        run: |
          $out = 'build\windows\x64\runner\Release'
          Get-ChildItem $out -Recurse -File | Select-Object -ExpandProperty FullName
          if (-not (Test-Path "$out\pdfium.dll")) { throw 'pdfium.dll is missing' }
          New-Item -ItemType Directory -Force dist\Pagelume | Out-Null
          Copy-Item "$out\*" dist\Pagelume -Recurse
          Compress-Archive -Path dist\Pagelume -DestinationPath dist\Pagelume-windows.zip
          Get-Item dist\Pagelume-windows.zip | Select-Object Name, Length
      # Microsoft Store packages, made from the same Release folder (so they
      # carry Tesseract and the runtime DLLs too):
      #  - Pagelume-store.msix: unsigned, for Partner Center (the Store signs it).
      #  - Pagelume-msix-test.zip: the same app signed with a throwaway test
      #    certificate under the Store publisher name, plus that certificate,
      #    so it can be tried on a PC before it reaches the Store.
      - name: Make the MSIX packages
        shell: pwsh
        run: |
          dart run msix:create --store --output-path dist --output-name Pagelume-store
          if (-not (Test-Path dist\Pagelume-store.msix)) { throw 'Store MSIX was not made' }
          $publisher = 'CN=6D7E4508-ABA9-446C-B3C4-79B8735C43D3'  # must match msix_config
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'Pagelume test package' -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pw = ConvertTo-SecureString -String 'pagelume-test' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath test-cert.pfx -Password $pw | Out-Null
          New-Item -ItemType Directory -Force dist\msix-test | Out-Null
          Export-Certificate -Cert $cert -FilePath dist\msix-test\Pagelume-test-certificate.cer | Out-Null
          dart run msix:create --certificate-path test-cert.pfx --certificate-password pagelume-test `
            --output-path dist\msix-test --output-name Pagelume-test
          Remove-Item test-cert.pfx
          Compress-Archive -Path dist\msix-test\* -DestinationPath dist\Pagelume-msix-test.zip
          Get-Item dist\*.msix, dist\*.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: pagelume-windows
          path: |
            dist/Pagelume-windows.zip
            dist/Pagelume-store.msix
            dist/Pagelume-msix-test.zip
      # Keep the newest zip on a branch named "windows" (a link that never
      # changes) and as the "windows-app" release (a tag named "windows" would
      # clash with the branch).
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir pub && cp dist/Pagelume-windows.zip dist/Pagelume-store.msix dist/Pagelume-msix-test.zip pub/
          cd pub
          git init -q -b windows
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" windows
          cd ..
          gh release delete windows --yes --cleanup-tag || true  # old name
          gh release delete windows-app --yes --cleanup-tag || true
          gh release create windows-app dist/Pagelume-windows.zip --target "$GITHUB_SHA" \
            --title "Pagelume for Windows, build ${GITHUB_RUN_NUMBER}" --latest=false \
            --notes "Download Pagelume-windows.zip, unzip it anywhere (for example Documents), then open Pagelume.exe in the Pagelume folder."
          gh release edit windows-app --draft=false --latest=false
