name: Build iOS app
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - run: flutter pub get
      # Unsigned build: proves the iOS app compiles until the App Store
      # signing keys are added as secrets.
      - run: flutter build ios --release --no-codesign --build-number ${{ github.run_number }}
      - name: Zip the app
        run: cd build/ios/iphoneos && zip -qr ../../../Pagelume-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: pagelume-ios-unsigned
          path: Pagelume-unsigned.zip
