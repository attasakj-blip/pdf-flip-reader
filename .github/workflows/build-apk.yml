name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      # Smaller APK for modern 64-bit phones (most phones from 2019 on).
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-flip-reader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # Also keep the latest APK on a branch named "apk", so it can be
      # downloaded straight from the repository page (or fetched by Claude).
      - name: Publish APK to the apk branch
        run: |
          mkdir out && cp build/app/outputs/flutter-apk/app-release.apk out/pdf-flip-reader.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/pdf-flip-reader-arm64.apk
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pdf-flip-reader.apk pdf-flip-reader-arm64.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
