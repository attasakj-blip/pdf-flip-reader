name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Restore the Play upload key
        if: env.UPLOAD_KEYSTORE_PASSWORD != ''
        run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --build-number ${{ github.run_number }}
      # Smaller APK for modern 64-bit phones (most phones from 2019 on).
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-number ${{ github.run_number }}
      # App bundle for Google Play, only once the upload key password is set.
      - if: env.UPLOAD_KEYSTORE_PASSWORD != ''
        run: flutter build appbundle --release --build-number ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: pagelume-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # Also keep the latest APK on a branch named "apk", so it can be
      # downloaded straight from the repository page (or fetched by Claude).
      - name: Publish APK to the apk branch
        run: |
          # The all-phones APK is over GitHub's 100 MB file limit (it stays
          # downloadable as the run's artifact); publish one APK per CPU type.
          mkdir out && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/pagelume-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/pagelume-armv7.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ] && [ $(stat -c%s build/app/outputs/bundle/release/app-release.aab) -lt 99000000 ]; then
            cp build/app/outputs/bundle/release/app-release.aab out/pagelume.aab
          fi
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
